<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <!-- Logo Mark: Two offset pills (dark background version) -->
  <g>
    <!-- Top pill - white, wider, left-aligned -->
    <rect x="2" y="8" width="38" height="14" rx="7" ry="7" fill="#FFFFFF"/>
    <!-- Bottom pill - green, slightly shorter, offset right -->
    <rect x="10" y="28" width="34" height="14" rx="7" ry="7" fill="#3CC25E"/>
  </g>
  <!-- Wordmark -->
  <text x="58" y="38" font-family="'Sora', 'Poppins', 'Nunito', sans-serif" font-weight="800" font-size="34" letter-spacing="-0.5">
    <tspan fill="#FFFFFF">concil</tspan><tspan fill="#3CC25E">ia</tspan>
  </text>
</svg>
